server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router: send unknown paths (/dashboard, /pay, ...) to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
